plugins {
    id 'java'
}

group = 'me.bear'
version = '1.12-1.21.10'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:$paperApiVersion"
}

// paper-api 26.2 ships Java 25 bytecode, so the plugin has to target 25 as well.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all,-processing'
}

processResources {
    def props = [version: project.version, apiVersion: paperApiVersion.replaceAll(/\.build\..*/, '')]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

tasks.jar {
    archiveFileName.set("MoreLoomLayers.jar")
}
