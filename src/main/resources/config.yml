# MoreLoomLayers configuration
#
# names:
#   Display names used for the extra lore lines that emulate the vanilla banner
#   tooltip (vanilla itself only renders the first 6 layers). Keys are banner
#   pattern registry keys; any pattern that is missing here is added on startup
#   with a name derived from its key, so translating is just a matter of editing
#   the generated entries.
#
# patterns:
#   No longer written. Older versions stored the extra layers as numeric ordinals
#   defined here; if such a section still exists it is only used to read banners
#   that were left inside a loom back then. New data is stored by registry key,
#   so it survives config edits and Minecraft updates.

names:
  minecraft:base: Base
  minecraft:border: Bordure
  minecraft:bricks: Field Masoned
  minecraft:circle: Roundel
  minecraft:creeper: Creeper Charge
  minecraft:cross: Saltire
  minecraft:curly_border: Bordure Indented
  minecraft:diagonal_left: Per Bend Inverted
  minecraft:diagonal_right: Per Bend Sinister Inverted
  minecraft:diagonal_up_left: Per Bend Sinister
  minecraft:diagonal_up_right: Per Bend
  minecraft:flow: Flow
  minecraft:flower: Flower Charge
  minecraft:globe: Globe
  minecraft:gradient: Gradient
  minecraft:gradient_up: Base Gradient
  minecraft:guster: Guster
  minecraft:half_horizontal: Per Fess
  minecraft:half_horizontal_bottom: Per Fess Inverted
  minecraft:half_vertical: Per Pale
  minecraft:half_vertical_right: Per Pale Inverted
  minecraft:mojang: Thing
  minecraft:piglin: Snout
  minecraft:rhombus: Lozenge
  minecraft:skull: Skull Charge
  minecraft:small_stripes: Paly
  minecraft:square_bottom_left: Base Dexter Canton
  minecraft:square_bottom_right: Base Sinister Canton
  minecraft:square_top_left: Chief Dexter Canton
  minecraft:square_top_right: Chief Sinister Canton
  minecraft:straight_cross: Cross
  minecraft:stripe_bottom: Base
  minecraft:stripe_center: Pale
  minecraft:stripe_downleft: Bend Sinister
  minecraft:stripe_downright: Bend
  minecraft:stripe_left: Pale Dexter
  minecraft:stripe_middle: Fess
  minecraft:stripe_right: Pale Sinister
  minecraft:stripe_top: Chief
  minecraft:triangle_bottom: Chevron
  minecraft:triangle_top: Inverted Chevron
  minecraft:triangles_bottom: Base Indented
  minecraft:triangles_top: Chief Indented
